modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create is what we film. Optional so the mod still loads in a bare client for smoke tests —
# the schematic loader itself only needs vanilla StructureTemplate.
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"
