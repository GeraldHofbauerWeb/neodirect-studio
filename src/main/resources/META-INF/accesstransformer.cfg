# The mouse pointer is part of the picture.
#
# A take that opens a container on camera draws whatever tooltip the pointer happens to be resting
# on — a materials chest came out with "Large Cogwheel, Hold [W] to Ponder" across the middle of
# it. Moving the OS cursor with glfwSetCursorPos does not help: GLFW only honours that for a window
# with input focus, and the studio window rarely has it while a take is running.
#
# Minecraft keeps its own pointer position and exposes only a getter, so the field is opened here.
# An access transformer rather than reflection: it is the supported way to say this, and it fails
# at build time if the field is ever renamed instead of at midnight during a shoot.
public net.minecraft.client.MouseHandler xpos
public net.minecraft.client.MouseHandler ypos

# The pixels of a stitched sprite.
#
# The studio's viewport draws the build as voxels and wants the textures the game is already
# showing, rather than a second copy of every resource pack shipped alongside it. SpriteContents
# keeps the image it was stitched from and exposes only its size, so the field is opened here.
# The alternative is downloading the whole atlas back off the GPU, which needs the render thread
# for a picture that is already sitting in main memory.
public net.minecraft.client.renderer.texture.SpriteContents originalImage
