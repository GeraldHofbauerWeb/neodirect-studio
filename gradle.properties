org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings — same pairing VanillaPlusAdditions uses on this machine.
neogradle.subsystems.parchment.minecraftVersion=1.21
neogradle.subsystems.parchment.mappingsVersion=2024.11.10

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

# Create — jar in libs/, taken from the sebsmodpack4 instance so it matches the version the
# pilot schematic was exported with. Create 6.0.x bundles Flywheel, which requires NeoForge
# 21.1.66+ — that is why this project is on the 21.1 line and not on VPA's 21.0.167.
create_version=6.0.10

# Quark supplies the quark:oak_chest the pilot schematic uses; Zeta is its required library.
quark_jar=Quark-4.1-477.jar
zeta_jar=Zeta-1.1-40.jar

## Mod Properties
mod_id=neodirect
mod_name=NeoDirect
mod_license=MIT
mod_version=0.1.0-proto
mod_group_id=net.geraldhofbauer.neodirect
mod_authors=Gerald Hofbauer
mod_description=A director for scripted Minecraft tutorial recordings: plays a timeline of block placements, camera moves and presentation cues in sync with pre-rendered narration.
